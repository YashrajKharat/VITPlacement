<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="coreProcessGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="studentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="recruiterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="tpoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="adminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    
    <!-- Filter for soft shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="processShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.25"/>
    </filter>
    
    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  
  <!-- Title Box -->
  <rect x="300" y="30" width="800" height="70" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="700" y="65" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Placement Portal &amp; Recruitment Management System</text>
  <text x="700" y="88" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600" fill="#64748b">Context Level DFD (Level 0 Data Flow Diagram)</text>

  <!-- ==================== CENTRAL PROCESS (0.0) ==================== -->
  <circle cx="700" cy="460" r="140" fill="url(#coreProcessGrad)" filter="url(#processShadow)"/>
  <circle cx="700" cy="460" r="130" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <text x="700" y="425" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800" fill="#c7d2fe">PROCESS 0.0</text>
  <text x="700" y="455" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Smart Campus</text>
  <text x="700" y="480" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Placement Portal</text>
  <text x="700" y="505" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="500" fill="#e0e7ff">&amp; AI Recruitment Hub</text>

  <!-- ==================== EXTERNAL ENTITIES ==================== -->
  
  <!-- 1. STUDENT ENTITY (Top-Left) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="150" width="220" height="120" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="80" y="150" width="220" height="36" rx="14" fill="url(#studentGrad)"/>
    <text x="190" y="174" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ENTITY: STUDENT</text>
    <text x="190" y="210" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#334155">Job Candidates &amp; Interns</text>
    <text x="190" y="230" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#64748b">Profile, Resume, Applications</text>
  </g>

  <!-- 2. RECRUITER ENTITY (Top-Right) -->
  <g filter="url(#cardShadow)">
    <rect x="1100" y="150" width="220" height="120" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="1100" y="150" width="220" height="36" rx="14" fill="url(#recruiterGrad)"/>
    <text x="1210" y="174" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ENTITY: RECRUITER</text>
    <text x="1210" y="210" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#334155">Corporate Hiring Partners</text>
    <text x="1210" y="230" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#64748b">Post Jobs, Interview, Offers</text>
  </g>

  <!-- 3. TPO / PLACEMENT CELL (Bottom-Left) -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="650" width="220" height="120" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="80" y="650" width="220" height="36" rx="14" fill="url(#tpoGrad)"/>
    <text x="190" y="674" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ENTITY: TPO / CELL</text>
    <text x="190" y="710" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#334155">Training &amp; Placement Officers</text>
    <text x="190" y="730" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#64748b">Verify Drives, Reports, Stats</text>
  </g>

  <!-- 4. SYSTEM ADMIN (Bottom-Right) -->
  <g filter="url(#cardShadow)">
    <rect x="1100" y="650" width="220" height="120" rx="14" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="1100" y="650" width="220" height="36" rx="14" fill="url(#adminGrad)"/>
    <text x="1210" y="674" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">ENTITY: ADMIN</text>
    <text x="1210" y="710" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#334155">College &amp; System Super Admin</text>
    <text x="1210" y="730" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#64748b">User Roles, Logs, Security</text>
  </g>

  <!-- 5. AI ENGINE / PARSER (Top-Center External Service) -->
  <g filter="url(#cardShadow)">
    <rect x="580" y="130" width="240" height="85" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
    <rect x="580" y="130" width="240" height="28" rx="12" fill="url(#aiGrad)"/>
    <text x="700" y="150" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">EXTERNAL: AI &amp; RESUME PARSER</text>
    <text x="700" y="180" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#475569">PDF/DOCX Extraction &amp; ATS Scoring</text>
  </g>


  <!-- ==================== DATA FLOWS (ARROWS & LABELS) ==================== -->

  <!-- STUDENT -> SYSTEM -->
  <path d="M 300 190 C 440 200, 520 320, 580 390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="245" width="210" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="435" y="260" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Resume Files (PDF/DOCX),</text>
  <text x="435" y="273" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">Job Applications, Profile Data</text>

  <!-- SYSTEM -> STUDENT -->
  <path d="M 570 470 C 470 480, 360 380, 270 270" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="290" y="380" width="210" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="395" y="395" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#0284c7">Auto-filled Profile, ATS Score,</text>
  <text x="395" y="408" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">Interview Links, Offer Letters</text>


  <!-- RECRUITER -> SYSTEM -->
  <path d="M 1100 190 C 960 200, 880 320, 820 390" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="870" y="245" width="200" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="970" y="260" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Job Openings, Interview Slots,</text>
  <text x="970" y="273" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">Offer Packages, Shortlisting</text>

  <!-- SYSTEM -> RECRUITER -->
  <path d="M 830 470 C 930 480, 1040 380, 1130 270" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="910" y="380" width="200" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="1010" y="395" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#059669">Candidate Resumes &amp; Scores,</text>
  <text x="1010" y="408" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">Applicant List, Offer Acceptance</text>


  <!-- TPO -> SYSTEM -->
  <path d="M 300 700 C 440 690, 520 600, 580 530" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="330" y="605" width="200" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="430" y="620" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Company Verifications,</text>
  <text x="430" y="633" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">Drive Approvals, Policy Setup</text>

  <!-- SYSTEM -> TPO -->
  <path d="M 570 510 C 460 550, 360 630, 280 670" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="330" y="525" width="200" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="430" y="540" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#d97706">Placement Analytics, Drive Stats,</text>
  <text x="430" y="553" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">Eligible Students &amp; Offer Logs</text>


  <!-- ADMIN -> SYSTEM -->
  <path d="M 1100 700 C 960 690, 880 600, 820 530" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="880" y="605" width="200" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="980" y="620" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#1e293b">User Management, Role Grants,</text>
  <text x="980" y="633" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">Database Maintenance</text>

  <!-- SYSTEM -> ADMIN -->
  <path d="M 830 510 C 940 550, 1040 630, 1120 670" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="880" y="525" width="200" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="980" y="540" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#dc2626">Audit Activity Logs, System Health,</text>
  <text x="980" y="553" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#64748b">User Security Alerts</text>


  <!-- SYSTEM <-> AI ENGINE (Top) -->
  <path d="M 670 320 L 670 215" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="635" y="270" text-anchor="end" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#9333ea">Raw Resume Buffer</text>
  
  <path d="M 730 215 L 730 320" fill="none" stroke="#9333ea" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="765" y="270" text-anchor="start" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#9333ea">Structured JSON &amp; ATS Score</text>

  <!-- Legend Box (Bottom Center) -->
  <rect x="520" y="800" width="360" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="550" y1="830" x2="600" y2="830" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="834" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#334155">Input Request</text>
  <line x1="710" y1="830" x2="760" y2="830" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="770" y="834" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#334155">Output Response</text>
</svg>
