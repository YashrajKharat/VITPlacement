<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="procGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="studentGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    
    <filter id="shadowL2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="procShadow2" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.22"/>
    </filter>

    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrIndigo2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="url(#bgGrad2)"/>

  <!-- Title Header -->
  <rect x="350" y="25" width="900" height="75" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadowL2)"/>
  <text x="800" y="58" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Level 2 DFD: Process 2.0 Subsystem Drill-Down</text>
  <text x="800" y="82" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="600" fill="#64748b">AI Resume Document Ingestion, Text Extraction, Heuristic Parsing &amp; ATS Scoring Pipeline</text>

  <!-- External Entity: Student -->
  <g filter="url(#shadowL2)">
    <rect x="60" y="320" width="190" height="110" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="60" y="320" width="190" height="32" rx="14" fill="url(#studentGrad2)"/>
    <text x="155" y="342" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">STUDENT</text>
    <text x="155" y="375" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#334155">Uploads Resume File</text>
    <text x="155" y="395" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#64748b">(.PDF / .DOCX / .TXT)</text>
  </g>

  <!-- Process 2.1: File Upload & Validation -->
  <g filter="url(#procShadow2)">
    <circle cx="400" cy="375" r="70" fill="url(#procGrad2)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="400" y="355" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">2.1</text>
    <text x="400" y="375" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">File Upload &amp;</text>
    <text x="400" y="393" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Size Validation</text>
  </g>

  <!-- Process 2.2: Buffer Extraction -->
  <g filter="url(#procShadow2)">
    <circle cx="680" cy="375" r="70" fill="url(#procGrad2)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="680" y="355" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">2.2</text>
    <text x="680" y="375" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Multi-Format</text>
    <text x="680" y="393" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Text Extraction</text>
  </g>

  <!-- Process 2.3: Token Cleanup & Layout Preprocessing -->
  <g filter="url(#procShadow2)">
    <circle cx="960" cy="375" r="70" fill="url(#procGrad2)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="960" y="355" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">2.3</text>
    <text x="960" y="375" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Token Cleaning &amp;</text>
    <text x="960" y="393" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Line Separation</text>
  </g>

  <!-- Process 2.4: Detail Extraction (AI + Regex) -->
  <g filter="url(#procShadow2)">
    <circle cx="1250" cy="375" r="75" fill="url(#procGrad2)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1250" y="355" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">2.4</text>
    <text x="1250" y="375" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">AI &amp; Heuristic</text>
    <text x="1250" y="393" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Detail Parser</text>
  </g>

  <!-- Process 2.5: ATS Scorer -->
  <g filter="url(#procShadow2)">
    <circle cx="1250" cy="680" r="70" fill="url(#procGrad2)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="1250" y="660" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">2.5</text>
    <text x="1250" y="680" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">ATS Compliance</text>
    <text x="1250" y="698" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">&amp; Keyword Score</text>
  </g>

  <!-- Process 2.6: Profile Persistence -->
  <g filter="url(#procShadow2)">
    <circle cx="680" cy="680" r="70" fill="url(#procGrad2)" stroke="#ffffff" stroke-width="2.5"/>
    <text x="680" y="660" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="800" fill="#c7d2fe">2.6</text>
    <text x="680" y="680" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Database Profile</text>
    <text x="680" y="698" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#e0e7ff">Persistence &amp; Sync</text>
  </g>

  <!-- Data Stores -->
  <!-- Storage FS: Public Resumes Directory -->
  <g filter="url(#shadowL2)">
    <rect x="290" y="530" width="220" height="42" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <line x1="340" y1="530" x2="340" y2="572" stroke="#475569" stroke-width="1.5"/>
    <text x="315" y="556" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="800" fill="#4338ca">FS</text>
    <text x="425" y="556" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">public/uploads/resumes/</text>
  </g>

  <!-- D2: Student Database Table -->
  <g filter="url(#shadowL2)">
    <rect x="580" y="850" width="200" height="42" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <line x1="630" y1="850" x2="630" y2="892" stroke="#475569" stroke-width="1.5"/>
    <text x="605" y="876" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="800" fill="#4338ca">D2</text>
    <text x="710" y="876" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="600" fill="#1e293b">Student Profiles Store</text>
  </g>


  <!-- Flow Lines -->
  <!-- Student -> 2.1 -->
  <path d="M 250 375 L 330 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="290" y="365" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#334155">Resume File</text>

  <!-- 2.1 -> FS -->
  <path d="M 400 445 L 400 530" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="440" y="490" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#475569">Save File Buffer</text>

  <!-- 2.1 -> 2.2 -->
  <path d="M 470 375 L 610 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="540" y="365" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#334155">Binary Buffer</text>

  <!-- 2.2 -> 2.3 -->
  <path d="M 750 375 L 890 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="820" y="365" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#334155">Raw Text</text>

  <!-- 2.3 -> 2.4 -->
  <path d="M 1030 375 L 1175 375" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="1100" y="365" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#334155">Normalized Lines</text>

  <!-- 2.4 -> 2.5 -->
  <path d="M 1250 450 L 1250 610" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="1260" y="530" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#334155">Extracted Skills &amp; Text</text>

  <!-- 2.5 -> 2.6 -->
  <path d="M 1180 680 L 750 680" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="960" y="670" text-anchor="middle" font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" fill="#334155">Structured JSON Payload + ATS Score</text>

  <!-- 2.6 -> D2 -->
  <path d="M 680 750 L 680 850" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="690" y="800" font-family="Segoe UI, Inter, sans-serif" font-size="10" fill="#475569">Persist Student Record</text>

  <!-- 2.6 -> Student (UI Update) -->
  <path d="M 610 680 C 350 680, 160 550, 160 430" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrIndigo2)"/>
  <text x="270" y="600" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="600" fill="#4f46e5">Auto-Filled Form State (Name, CGPA, Skills, Projects)</text>
</svg>
